<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner HD de Documentos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF Library for generating PDF files client-side -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom UI Tweaks and Mobile Optimizations */
        body {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* Dynamic Viewport & Safe Area Support for Mobile Devices */
        .app-viewport {
            height: 100vh;
            height: 100dvh;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-top: env(safe-area-inset-top, 0px);
        }

        .canvas-container {
            position: relative;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        @keyframes scan-line {
            0% { top: 0%; opacity: 0.8; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0.8; }
        }
        .scan-animation::after {
            content: '';
            position: absolute;
            left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
            box-shadow: 0 0 15px #3b82f6;
            animation: scan-line 2.5s infinite ease-in-out;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="app-viewport w-screen overflow-hidden flex flex-col bg-slate-950 text-slate-100">

    <!-- TOP HEADER -->
    <header class="h-12 sm:h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-3 sm:px-4 z-20 shrink-0">
        <div class="flex items-center gap-2">
            <i class="fa-solid font-bold fa-file-invoice text-blue-500 text-lg sm:text-xl"></i>
            <h1 class="font-bold text-base sm:text-lg tracking-wide text-white">DocScan <span class="text-[10px] sm:text-xs bg-blue-600/30 text-blue-400 px-1.5 sm:px-2 py-0.5 rounded-full border border-blue-500/30">HD</span></h1>
        </div>
        <div class="flex items-center gap-2 text-xs">
            <span id="pageCounterBadge" class="hidden bg-slate-800 border border-slate-700 px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-full text-[11px] sm:text-xs text-slate-300 font-medium">
                Página <span id="currentPageNum" class="text-blue-400 font-bold">0</span> de <span id="totalPagesNum">0</span>
            </span>
        </div>
    </header>

    <!-- STEP PROGRESS BAR -->
    <nav class="bg-slate-900/80 backdrop-blur border-b border-slate-800 px-2 sm:px-4 py-1.5 flex justify-between text-[11px] sm:text-xs z-10 shrink-0">
        <div id="step1Indicator" class="flex-1 text-center py-1 border-b-2 border-blue-500 text-blue-400 font-semibold flex items-center justify-center gap-1">
            <span class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-blue-500 text-white flex items-center justify-center text-[9px] sm:text-[10px]">1</span>
            Capturar
        </div>
        <div id="step2Indicator" class="flex-1 text-center py-1 border-b-2 border-transparent text-slate-400 font-medium flex items-center justify-center gap-1">
            <span class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center text-[9px] sm:text-[10px]">2</span>
            Ajustar
        </div>
        <div id="step3Indicator" class="flex-1 text-center py-1 border-b-2 border-transparent text-slate-400 font-medium flex items-center justify-center gap-1">
            <span class="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center text-[9px] sm:text-[10px]">3</span>
            Documento PDF
        </div>
    </nav>

    <!-- MAIN VIEW CONTAINER -->
    <main class="flex-1 min-h-0 relative overflow-hidden flex flex-col justify-center items-center p-2">

        <!-- STEP 1: CAMERA CAPTURE / UPLOAD -->
        <section id="step1View" class="w-full h-full flex flex-col items-center justify-between relative max-w-lg mx-auto min-h-0">
            <div class="relative w-full flex-1 min-h-0 bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl flex items-center justify-center">
                <video id="videoFeed" autoplay playsinline class="w-full h-full object-cover hidden"></video>
                
                <div id="cameraPlaceholder" class="flex flex-col items-center justify-center text-slate-500 p-4 text-center">
                    <i class="fa-solid fa-camera-retro text-5xl sm:text-6xl mb-3 text-slate-700 animate-pulse"></i>
                    <p class="text-xs sm:text-sm">Inicie a câmera HD ou carregue uma imagem para começar a digitalização</p>
                </div>

                <div id="cameraOverlay" class="absolute inset-3 sm:inset-4 border-2 border-dashed border-blue-500/50 rounded-lg pointer-events-none hidden scan-animation flex items-center justify-center">
                    <span class="text-[10px] sm:text-xs text-blue-300/70 bg-slate-950/70 px-2.5 py-1 rounded-full backdrop-blur">Posicione o documento no centro</span>
                </div>
            </div>

            <div class="w-full py-2 sm:py-3 shrink-0 flex flex-col gap-2">
                <div class="flex items-center justify-around gap-2">
                    <label class="flex flex-col items-center justify-center w-12 h-12 sm:w-14 sm:h-14 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 rounded-full border border-slate-700 cursor-pointer transition shadow-md">
                        <i class="fa-solid fa-image text-base sm:text-lg"></i>
                        <span class="text-[8px] sm:text-[9px] mt-0.5">Galeria</span>
                        <input type="file" id="fileInput" accept="image/*" class="hidden">
                    </label>

                    <button id="captureBtn" class="w-16 h-16 sm:w-20 sm:h-20 bg-blue-600 hover:bg-blue-500 active:scale-90 rounded-full border-4 border-slate-950 shadow-lg shadow-blue-500/30 flex items-center justify-center transition focus:outline-none">
                        <div class="w-11 h-11 sm:w-14 sm:h-14 rounded-full border-2 border-white/80 bg-blue-500 flex items-center justify-center">
                            <i class="fa-solid fa-camera text-white text-xl sm:text-2xl"></i>
                        </div>
                    </button>

                    <button id="toggleCamBtn" class="w-12 h-12 sm:w-14 sm:h-14 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 rounded-full border border-slate-700 flex flex-col items-center justify-center transition shadow-md">
                        <i class="fa-solid fa-camera-rotate text-base sm:text-lg"></i>
                        <span class="text-[8px] sm:text-[9px] mt-0.5">Inverter</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- STEP 2: CORNER ADJUSTMENT / CROP -->
        <section id="step2View" class="w-full h-full flex flex-col items-center justify-between hidden max-w-lg mx-auto min-h-0">
            <div class="w-full bg-slate-900 px-3 py-1.5 rounded-xl mb-1.5 flex justify-between items-center text-[11px] sm:text-xs text-slate-300 border border-slate-800 shrink-0">
                <span><i class="fa-solid fa-hand-pointer text-blue-400 mr-1"></i>Arraste os 4 cantos para alinhar</span>
                <button id="autoDetectBtn" class="text-blue-400 hover:text-blue-300 font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Resetar
                </button>
            </div>

            <div class="relative w-full flex-1 min-h-0 bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl flex items-center justify-center canvas-container">
                <canvas id="cropCanvas" class="max-w-full max-h-full object-contain cursor-crosshair"></canvas>
            </div>

            <div class="w-full py-2 sm:py-3 shrink-0 flex gap-2">
                <button id="retakeBtn" class="flex-1 py-2.5 sm:py-3 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 font-semibold rounded-xl border border-slate-700 flex items-center justify-center gap-2 transition text-xs sm:text-sm">
                    <i class="fa-solid fa-arrow-left"></i> Recapturar
                </button>
                <button id="applyCropBtn" class="flex-1 py-2.5 sm:py-3 bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2 transition text-xs sm:text-sm">
                    Confirmar <i class="fa-solid fa-check"></i>
                </button>
            </div>
        </section>

        <!-- STEP 3: PREVIEW & FILTER & PDF EXPORT -->
        <section id="step3View" class="w-full h-full flex flex-col items-center justify-between hidden max-w-lg mx-auto min-h-0">
            <div class="w-full bg-slate-900/90 p-1 rounded-xl mb-1.5 flex justify-around text-[10px] sm:text-xs border border-slate-800 shrink-0">
                <button data-filter="original" class="filter-btn active-filter px-2.5 py-1 rounded-lg font-medium text-slate-300 transition">Original</button>
                <button data-filter="bw" class="filter-btn px-2.5 py-1 rounded-lg font-medium text-slate-300 transition">Documento P&B</button>
                <button data-filter="grayscale" class="filter-btn px-2.5 py-1 rounded-lg font-medium text-slate-300 transition">Cinza</button>
                <button data-filter="magic" class="filter-btn px-2.5 py-1 rounded-lg font-medium text-slate-300 transition">Magic HD</button>
            </div>

            <div class="relative w-full flex-1 min-h-0 bg-slate-900 rounded-2xl overflow-hidden border border-slate-800 shadow-2xl flex items-center justify-center p-1.5">
                <canvas id="previewCanvas" class="max-w-full max-h-full object-contain rounded border border-slate-800 shadow-md"></canvas>
            </div>

            <div class="w-full my-1.5 bg-slate-900/50 p-1.5 rounded-xl border border-slate-800/80 flex items-center gap-2 overflow-x-auto no-scrollbar shrink-0">
                <div id="thumbnailsContainer" class="flex items-center gap-2"></div>
                <button id="addPageBtn" class="shrink-0 w-10 h-14 sm:w-12 sm:h-16 rounded-lg border-2 border-dashed border-blue-500/50 hover:border-blue-500 text-blue-400 flex flex-col items-center justify-center gap-0.5 text-[10px] font-semibold bg-blue-500/5 transition active:scale-95">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>Página</span>
                </button>
            </div>

            <div class="w-full pb-1 sm:pb-2 shrink-0 flex gap-2">
                <button id="deletePageBtn" class="px-3.5 py-2.5 sm:py-3 bg-red-950/40 hover:bg-red-900/50 text-red-400 border border-red-800/50 font-semibold rounded-xl flex items-center justify-center transition active:scale-95" title="Excluir página atual">
                    <i class="fa-solid fa-trash-can text-sm"></i>
                </button>
                <button id="downloadPdfBtn" class="flex-1 py-2.5 sm:py-3 bg-blue-600 hover:bg-blue-500 active:scale-90 text-white font-bold rounded-xl shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 transition text-xs sm:text-sm">
                    <i class="fa-solid fa-file-pdf text-sm"></i> Baixar PDF
                </button>
                <button id="sharePdfBtn" class="px-3.5 py-2.5 sm:py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold rounded-xl flex items-center justify-center transition active:scale-95" title="Compartilhar PDF">
                    <i class="fa-solid fa-share-nodes text-sm"></i>
                </button>
            </div>
        </section>

    </main>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-white px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-2 text-xs opacity-0 pointer-events-none transition-all duration-300 z-50">
        <i id="toastIcon" class="fa-solid fa-circle-info text-blue-400"></i>
        <span id="toastMsg">Mensagem</span>
    </div>

    <!-- SCRIPT LOGIC (NATIVE FAST CANVAS ENGINE) -->
    <script>
        const state = {
            stream: null,
            facingMode: 'environment',
            currentStep: 1,
            rawImage: null,
            corners: [],
            activeCornerIndex: -1,
            pages: [],
            currentPageIndex: -1,
            currentFilter: 'original'
        };

        const elements = {
            videoFeed: document.getElementById('videoFeed'),
            cameraPlaceholder: document.getElementById('cameraPlaceholder'),
            cameraOverlay: document.getElementById('cameraOverlay'),
            fileInput: document.getElementById('fileInput'),
            captureBtn: document.getElementById('captureBtn'),
            toggleCamBtn: document.getElementById('toggleCamBtn'),
            
            cropCanvas: document.getElementById('cropCanvas'),
            retakeBtn: document.getElementById('retakeBtn'),
            applyCropBtn: document.getElementById('applyCropBtn'),
            autoDetectBtn: document.getElementById('autoDetectBtn'),

            previewCanvas: document.getElementById('previewCanvas'),
            thumbnailsContainer: document.getElementById('thumbnailsContainer'),
            addPageBtn: document.getElementById('addPageBtn'),
            downloadPdfBtn: document.getElementById('downloadPdfBtn'),
            sharePdfBtn: document.getElementById('sharePdfBtn'),
            deletePageBtn: document.getElementById('deletePageBtn'),

            step1View: document.getElementById('step1View'),
            step2View: document.getElementById('step2View'),
            step3View: document.getElementById('step3View'),

            step1Ind: document.getElementById('step1Indicator'),
            step2Ind: document.getElementById('step2Indicator'),
            step3Ind: document.getElementById('step3Indicator'),

            pageCounterBadge: document.getElementById('pageCounterBadge'),
            currentPageNum: document.getElementById('currentPageNum'),
            totalPagesNum: document.getElementById('totalPagesNum'),

            toast: document.getElementById('toast'),
            toastMsg: document.getElementById('toastMsg'),
            toastIcon: document.getElementById('toastIcon')
        };

        window.addEventListener('load', () => {
            initCamera();
            setupEventListeners();
        });

        function showToast(message, type = 'info') {
            elements.toastMsg.innerText = message;
            elements.toastIcon.className = type === 'error' 
                ? 'fa-solid fa-circle-exclamation text-red-400' 
                : 'fa-solid fa-circle-info text-blue-400';
            
            elements.toast.classList.remove('opacity-0', 'pointer-events-none');
            elements.toast.classList.add('opacity-100');
            setTimeout(() => {
                elements.toast.classList.remove('opacity-100');
                elements.toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        async function initCamera() {
            if (state.stream) {
                state.stream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: {
                        facingMode: state.facingMode,
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                };

                state.stream = await navigator.mediaDevices.getUserMedia(constraints);
                elements.videoFeed.srcObject = state.stream;
                elements.videoFeed.classList.remove('hidden');
                elements.cameraPlaceholder.classList.add('hidden');
                elements.cameraOverlay.classList.remove('hidden');
            } catch (err) {
                console.warn('Camera Access Warning:', err);
                elements.videoFeed.classList.add('hidden');
                elements.cameraPlaceholder.classList.remove('hidden');
                elements.cameraOverlay.classList.add('hidden');
                showToast('Acesso à câmera indisponível. Use a opção Galeria.', 'error');
            }
        }

        function setupEventListeners() {
            elements.toggleCamBtn.addEventListener('click', () => {
                state.facingMode = state.facingMode === 'environment' ? 'user' : 'environment';
                initCamera();
            });

            elements.captureBtn.addEventListener('click', captureFromVideo);
            elements.fileInput.addEventListener('change', handleFileUpload);

            elements.retakeBtn.addEventListener('click', () => switchStep(1));
            elements.applyCropBtn.addEventListener('click', processPerspectiveWarp);
            elements.autoDetectBtn.addEventListener('click', autoDetectCorners);

            setupCornerDragging();

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-filter', 'bg-blue-600', 'text-white'));
                    e.target.classList.add('active-filter', 'bg-blue-600', 'text-white');
                    state.currentFilter = e.target.dataset.filter;
                    applyFilterToCurrentPage();
                });
            });

            elements.addPageBtn.addEventListener('click', () => switchStep(1));
            elements.deletePageBtn.addEventListener('click', deleteCurrentPage);
            elements.downloadPdfBtn.addEventListener('click', generatePDF);
            elements.sharePdfBtn.addEventListener('click', sharePDF);
        }

        function switchStep(step) {
            state.currentStep = step;
            elements.step1View.classList.toggle('hidden', step !== 1);
            elements.step2View.classList.toggle('hidden', step !== 2);
            elements.step3View.classList.toggle('hidden', step !== 3);

            const activeStyle = ['border-blue-500', 'text-blue-400', 'font-semibold'];
            const inactiveStyle = ['border-transparent', 'text-slate-400', 'font-medium'];

            [elements.step1Ind, elements.step2Ind, elements.step3Ind].forEach((ind, i) => {
                if (i + 1 === step) {
                    ind.classList.add(...activeStyle);
                    ind.classList.remove(...inactiveStyle);
                } else {
                    ind.classList.remove(...activeStyle);
                    ind.classList.add(...inactiveStyle);
                }
            });

            if (step === 1 && !state.stream) {
                initCamera();
            }
        }

        function captureFromVideo() {
            if (!state.stream && elements.videoFeed.classList.contains('hidden')) {
                elements.fileInput.click();
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = elements.videoFeed.videoWidth || 1280;
            canvas.height = elements.videoFeed.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(elements.videoFeed, 0, 0, canvas.width, canvas.height);

            const img = new Image();
            img.onload = () => {
                state.rawImage = img;
                setupCornerDetectorCanvas();
                switchStep(2);
            };
            img.src = canvas.toDataURL('image/jpeg', 0.95);
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    state.rawImage = img;
                    setupCornerDetectorCanvas();
                    switchStep(2);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        function setupCornerDetectorCanvas() {
            const canvas = elements.cropCanvas;
            const img = state.rawImage;

            const container = canvas.parentElement;
            const maxW = container.clientWidth || 300;
            const maxH = container.clientHeight || 400;

            let scale = Math.min(maxW / img.width, maxH / img.height);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;

            autoDetectCorners();
        }

        function autoDetectCorners() {
            const canvas = elements.cropCanvas;
            const padX = canvas.width * 0.08;
            const padY = canvas.height * 0.08;

            state.corners = [
                { x: padX, y: padY },
                { x: canvas.width - padX, y: padY },
                { x: canvas.width - padX, y: canvas.height - padY },
                { x: padX, y: canvas.height - padY }
            ];

            drawCornerOverlay();
        }

        function drawCornerOverlay() {
            const canvas = elements.cropCanvas;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(state.rawImage, 0, 0, canvas.width, canvas.height);

            // Darkened Outer Overlay
            ctx.fillStyle = 'rgba(15, 23, 42, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Highlight Quad
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(state.corners[0].x, state.corners[0].y);
            for (let i = 1; i < 4; i++) {
                ctx.lineTo(state.corners[i].x, state.corners[i].y);
            }
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(state.rawImage, 0, 0, canvas.width, canvas.height);
            ctx.restore();

            // Polygon Stroke
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(state.corners[0].x, state.corners[0].y);
            for (let i = 1; i < 4; i++) {
                ctx.lineTo(state.corners[i].x, state.corners[i].y);
            }
            ctx.closePath();
            ctx.stroke();

            // Corner Handles
            state.corners.forEach((corner, index) => {
                ctx.beginPath();
                ctx.arc(corner.x, corner.y, 14, 0, 2 * Math.PI);
                ctx.fillStyle = '#2563eb';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(index + 1, corner.x, corner.y);
            });
        }

        function setupCornerDragging() {
            const canvas = elements.cropCanvas;

            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            };

            const handleStart = (e) => {
                const pos = getPos(e);
                const hitRadius = 35;
                state.activeCornerIndex = state.corners.findIndex(c => Math.hypot(c.x - pos.x, c.y - pos.y) < hitRadius);
            };

            const handleMove = (e) => {
                if (state.activeCornerIndex === -1) return;
                if (e.cancelable) e.preventDefault();
                const pos = getPos(e);

                pos.x = Math.max(0, Math.min(canvas.width, pos.x));
                pos.y = Math.max(0, Math.min(canvas.height, pos.y));

                state.corners[state.activeCornerIndex] = pos;
                drawCornerOverlay();
            };

            const handleEnd = () => {
                state.activeCornerIndex = -1;
            };

            canvas.addEventListener('mousedown', handleStart);
            canvas.addEventListener('mousemove', handleMove);
            window.addEventListener('mouseup', handleEnd);

            canvas.addEventListener('touchstart', handleStart, { passive: false });
            canvas.addEventListener('touchmove', handleMove, { passive: false });
            window.addEventListener('touchend', handleEnd);
        }

        function processPerspectiveWarp() {
            const canvas = elements.cropCanvas;
            const scaleX = state.rawImage.width / canvas.width;
            const scaleY = state.rawImage.height / canvas.height;

            const srcPoints = state.corners.map(c => ({
                x: c.x * scaleX,
                y: c.y * scaleY
            }));

            const topW = Math.hypot(srcPoints[1].x - srcPoints[0].x, srcPoints[1].y - srcPoints[0].y);
            const botW = Math.hypot(srcPoints[2].x - srcPoints[3].x, srcPoints[2].y - srcPoints[3].y);
            const targetWidth = Math.round(Math.max(topW, botW));

            const leftH = Math.hypot(srcPoints[3].x - srcPoints[0].x, srcPoints[3].y - srcPoints[0].y);
            const rightH = Math.hypot(srcPoints[2].x - srcPoints[1].x, srcPoints[2].y - srcPoints[1].y);
            const targetHeight = Math.round(Math.max(leftH, rightH));

            const outputCanvas = document.createElement('canvas');
            outputCanvas.width = targetWidth;
            outputCanvas.height = targetHeight;
            const outCtx = outputCanvas.getContext('2d');

            const srcCanvas = document.createElement('canvas');
            srcCanvas.width = state.rawImage.width;
            srcCanvas.height = state.rawImage.height;
            const srcCtx = srcCanvas.getContext('2d');
            srcCtx.drawImage(state.rawImage, 0, 0);

            const slices = 24;
            for (let y = 0; y < slices; y++) {
                for (let x = 0; x < slices; x++) {
                    const u1 = x / slices;
                    const v1 = y / slices;
                    const u2 = (x + 1) / slices;
                    const v2 = (y + 1) / slices;

                    const p1 = interpolateQuad(srcPoints, u1, v1);
                    const p2 = interpolateQuad(srcPoints, u2, v1);
                    const p3 = interpolateQuad(srcPoints, u2, v2);
                    const p4 = interpolateQuad(srcPoints, u1, v2);

                    const dx = u1 * targetWidth;
                    const dy = v1 * targetHeight;
                    const dw = (u2 - u1) * targetWidth;
                    const dh = (v2 - v1) * targetHeight;

                    outCtx.save();
                    outCtx.beginPath();
                    outCtx.rect(dx, dy, dw + 0.5, dh + 0.5);
                    outCtx.clip();

                    outCtx.drawImage(
                        srcCanvas, 
                        Math.max(0, Math.min(p1.x, srcCanvas.width)), 
                        Math.max(0, Math.min(p1.y, srcCanvas.height)), 
                        Math.max(1, (p2.x - p1.x)), 
                        Math.max(1, (p4.y - p1.y)), 
                        dx, dy, dw + 0.5, dh + 0.5
                    );
                    outCtx.restore();
                }
            }

            const scannedPage = {
                originalCanvas: outputCanvas,
                filter: 'original'
            };

            state.pages.push(scannedPage);
            state.currentPageIndex = state.pages.length - 1;

            updateUIAndThumbnails();
            switchStep(3);
            applyFilterToCurrentPage();
        }

        function interpolateQuad(pts, u, v) {
            const topX = pts[0].x + u * (pts[1].x - pts[0].x);
            const topY = pts[0].y + u * (pts[1].y - pts[0].y);
            const botX = pts[3].x + u * (pts[2].x - pts[3].x);
            const botY = pts[3].y + u * (pts[2].y - pts[3].y);

            return {
                x: topX + v * (botX - topX),
                y: topY + v * (botY - topY)
            };
        }

        function applyFilterToCurrentPage() {
            if (state.currentPageIndex === -1 || !state.pages[state.currentPageIndex]) return;

            const page = state.pages[state.currentPageIndex];
            page.filter = state.currentFilter;
            const srcCanvas = page.originalCanvas;

            const previewCanvas = elements.previewCanvas;
            previewCanvas.width = srcCanvas.width;
            previewCanvas.height = srcCanvas.height;
            const ctx = previewCanvas.getContext('2d');

            ctx.drawImage(srcCanvas, 0, 0);

            const imgData = ctx.getImageData(0, 0, previewCanvas.width, previewCanvas.height);
            const data = imgData.data;

            switch (state.currentFilter) {
                case 'bw':
                    for (let i = 0; i < data.length; i += 4) {
                        let avg = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
                        let val = avg > 128 ? 255 : 0;
                        data[i] = data[i + 1] = data[i + 2] = val;
                    }
                    break;

                case 'grayscale':
                    for (let i = 0; i < data.length; i += 4) {
                        let avg = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
                        data[i] = data[i + 1] = data[i + 2] = avg;
                    }
                    break;

                case 'magic':
                    for (let i = 0; i < data.length; i += 4) {
                        data[i] = Math.min(255, Math.max(0, (data[i] - 128) * 1.3 + 128 + 10));
                        data[i + 1] = Math.min(255, Math.max(0, (data[i + 1] - 128) * 1.3 + 128 + 10));
                        data[i + 2] = Math.min(255, Math.max(0, (data[i + 2] - 128) * 1.3 + 128 + 10));
                    }
                    break;

                case 'original':
                default:
                    break;
            }

            ctx.putImageData(imgData, 0, 0);
            updateThumbnails();
        }

        function updateUIAndThumbnails() {
            elements.pageCounterBadge.classList.remove('hidden');
            elements.currentPageNum.innerText = state.currentPageIndex + 1;
            elements.totalPagesNum.innerText = state.pages.length;

            updateThumbnails();
        }

        function updateThumbnails() {
            const container = elements.thumbnailsContainer;
            container.innerHTML = '';

            state.pages.forEach((page, index) => {
                const thumb = document.createElement('div');
                thumb.className = `relative w-12 h-16 rounded-lg overflow-hidden border-2 cursor-pointer transition flex-shrink-0 ${index === state.currentPageIndex ? 'border-blue-500 scale-105' : 'border-slate-700 opacity-70'}`;
                
                const img = document.createElement('img');
                img.className = 'w-full h-full object-cover';
                img.src = elements.previewCanvas.toDataURL('image/jpeg', 0.5);

                thumb.appendChild(img);
                thumb.addEventListener('click', () => {
                    state.currentPageIndex = index;
                    state.currentFilter = state.pages[index].filter;
                    updateUIAndThumbnails();
                    applyFilterToCurrentPage();
                });

                container.appendChild(thumb);
            });
        }

        function deleteCurrentPage() {
            if (state.pages.length === 0) return;

            state.pages.splice(state.currentPageIndex, 1);
            if (state.pages.length === 0) {
                state.currentPageIndex = -1;
                elements.pageCounterBadge.classList.add('hidden');
                switchStep(1);
            } else {
                state.currentPageIndex = Math.max(0, state.currentPageIndex - 1);
                updateUIAndThumbnails();
                applyFilterToCurrentPage();
            }
            showToast('Página removida');
        }

        async function buildPdfBlob() {
            const { jsPDF } = window.jspdf;
            let pdf = null;

            for (let i = 0; i < state.pages.length; i++) {
                state.currentPageIndex = i;
                state.currentFilter = state.pages[i].filter;
                applyFilterToCurrentPage();

                const imgData = elements.previewCanvas.toDataURL('image/jpeg', 0.92);
                const width = elements.previewCanvas.width;
                const height = elements.previewCanvas.height;

                const orientation = width > height ? 'l' : 'p';

                if (i === 0) {
                    pdf = new jsPDF({
                        orientation: orientation,
                        unit: 'px',
                        format: [width, height]
                    });
                } else {
                    pdf.addPage([width, height], orientation);
                }

                pdf.addImage(imgData, 'JPEG', 0, 0, width, height);
            }

            return pdf;
        }

        async function generatePDF() {
            if (state.pages.length === 0) return;
            showToast('Gerando documento PDF HD...');

            try {
                const pdf = await buildPdfBlob();
                pdf.save(`Documento_Digitalizado_${new Date().toISOString().slice(0, 10)}.pdf`);
                showToast('Download do PDF iniciado!');
            } catch (err) {
                console.error(err);
                showToast('Erro ao gerar o arquivo PDF', 'error');
            }
        }

        async function sharePDF() {
            if (state.pages.length === 0) return;

            if (!navigator.share || !navigator.canShare) {
                showToast('Compartilhamento não suportado neste navegador. Use "Baixar PDF".', 'error');
                return;
            }

            try {
                showToast('Preparando arquivo para compartilhamento...');
                const pdf = await buildPdfBlob();
                const blob = pdf.output('blob');
                const file = new File([blob], 'Documento_Digitalizado.pdf', { type: 'application/pdf' });

                if (navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: 'Documento Digitalizado',
                        text: 'Segue em anexo o documento digitalizado via DocScan HD.',
                        files: [file]
                    });
                } else {
                    showToast('Não é possível compartilhar este tipo de arquivo.', 'error');
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    showToast('Erro ao compartilhar PDF', 'error');
                }
            }
        }
    </script>
</body>
</html>
